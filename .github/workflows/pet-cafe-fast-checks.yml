name: Pet Cafe Fast Checks

on:
  push:
    branches: [chatgpt/pet-cafe-production]
    paths:
      - 'pet-cafe-tycoon/**'
      - '.github/workflows/pet-cafe-fast-checks.yml'

concurrency:
  group: pet-cafe-fast-checks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: pet-cafe-tycoon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pet-cafe-tycoon/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and simulation tests
        run: npm test
      - name: Production build
        run: npm run build
