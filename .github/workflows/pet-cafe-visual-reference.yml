name: Pet Cafe Current Visual Reference

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/pet-cafe-production
    paths:
      - '.github/workflows/pet-cafe-visual-reference.yml'
      - 'pet-cafe-tycoon/tools/current-visual-capture.mjs'
      - 'pet-cafe-tycoon/tools/service-depth-browser.mjs'

permissions:
  contents: read

concurrency:
  group: pet-cafe-current-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewarded-cert:
    name: Current café reference captures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: pet-cafe-tycoon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pet-cafe-tycoon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/pet-cafe-task38-preview.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/pet-cafe-task38-preview.log
          exit 1

      - name: Capture current café references
        run: node tools/current-visual-capture.mjs

      - name: Verify service consequences and owner reassurance
        run: node tools/service-depth-browser.mjs

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/pet-cafe-task38-preview.log || true

      - name: Upload current visual references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-visuals-${{ github.sha }}
          path: pet-cafe-tycoon/artifacts/current-visuals
          if-no-files-found: warn
          retention-days: 14
