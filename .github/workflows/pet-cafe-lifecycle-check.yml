name: Pet Cafe Lifecycle Diagnostic

# Diagnostic only. Per AGENTS.md, Fast Checks are the normal push gate and lifecycle browser
# diagnostics are run on demand when investigating lifecycle changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pet-cafe-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: pet-cafe-tycoon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pet-cafe-tycoon/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Integrated lifecycle diagnostic (not full certification)
        run: node tools/gate-a-lifecycle-smoke.js
      - name: Live Barista and actor-roster diagnostic
        if: ${{ !cancelled() }}
        run: node tools/barista-smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-diagnostic-${{ github.sha }}
          path: pet-cafe-tycoon/shots-production
          if-no-files-found: warn
          retention-days: 3
